org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is OFF.
#
# With it on, every `flutter build apk` fails deterministically at
# :shared_preferences_android:compileDebugKotlin with
#   "Could not close incremental caches in ...caches-jvm\jvm\kotlin"
# thrown from FilePageCache.registerPagedFileStorage. Reproduced three times
# with the Gradle and Kotlin daemons killed and build/ deleted, so it is not a
# stale lock — it is the memory-mapped incremental cache failing to close on
# Windows under this toolchain (Gradle 9.1 / AGP 9.0.1 / Kotlin 2.3.20), on a
# project path containing spaces.
#
# Cost: Kotlin recompiles fully each build instead of incrementally. That is
# acceptable here — the Android build is run to verify, not in a tight edit
# loop — and a slower build beats one that cannot complete.
#
# Revisit when the toolchain moves; if incremental compilation starts working,
# delete this line.
kotlin.incremental=false
